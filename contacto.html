<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto Nomadico</title>

    <link rel="stylesheet" href="styles/style.css">
</head>
    <header>
        <nav class="navbar">
		<div class="logo">Nomadico Outdoor</div>
            <ul>
                <a href="index.html">Inicio</a>
                <a href="productos.html">Productos</a>
                <a href="contacto.html">Contacto</a>
            </ul>
        </nav>
    </header>
<body>

    <h1 class="titulo-contacto">Servicio al Cliente</h1>

    <h2 class="titulo-contacto">Contáctanos</h2>
    <p style="text-align: center;">Si tienes alguna duda o consulta puedes ingresar tus datos y nos contactaremos contigo lo antes posible.</p>


        <form action="#" method="POST">
            <div>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
            </div>


                    <div>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div>
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="+56 9 1234 5678">
        </div>

        <div>
            <label for="motivo">Motivo de contacto:</label>
            <textarea id="motivo" name="motivo" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
        </div>

        <button type="submit">Enviar mensaje</button>
    </form>

</body>
</html>
