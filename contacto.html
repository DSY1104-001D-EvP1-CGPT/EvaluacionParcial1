<body>

    <h2 class="titulo-contacto">Servicio al Cliente</h2>

    <h3 class="titulo-contacto">Contáctanos</h3>
    <p style="text-align: center;">Si tienes alguna duda o consulta puedes ingresar tus datos y nos contactaremos contigo lo antes posible.</p>


        <form id="formulario-contacto" class="formulario-contacto" action="#" method="POST">
            <div>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
            </div>


                    <div>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div>
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="+56 9 1234 5678">
        </div>

        <div>
            <label for="motivo">Motivo de contacto:</label>
            <textarea id="motivo" name="motivo" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
        </div>

        <button type="submit">Enviar mensaje</button>
    </form>
    
    <footer>
        <div>
        <p>Nomadico Outdoor Spa 2026, Chile</p>
        </div>
    </footer>

    <script src="script/script.js"></script>

</body>
</html>
